# Pre-registro del periodo de papel (sección 15) — BORRADOR, pendiente de aprobación de Justin.
# Se fija ANTES del día 1. Cambiar algo después de ver resultados invalida la evaluación.
estado: borrador          # -> "aprobado" con fecha y firma de Justin antes del día 1
aprobado_por: null
fecha_aprobacion: null

estrategia:
  config: config/strategy.yaml          # bloqueada; su sha256 queda en cada fila de `signals`
  strategy_sha256: null                 # se llena al aprobar (python -c "from atlas.config import strategy_hash; print(strategy_hash())")
  codigo_git: null                      # commit con el que arranca el día 1
  ml: apagado

periodo:
  dia_1: null                           # primer día UTC tras aprobar F5 (7 días desatendidos)
  revisiones_meses: [3, 6, 12]
  sin_cambios_de_parametros: true

modos:
  A_paper: {capital_usdc: 10000, par: UBTC/USDC, libro: mainnet, llenado: maker_first, timeout_min: 30,
            taker_tope_slippage: 0.005, comisiones: {maker: 0.0004, taker: 0.0007}}
  B_testnet: {estado: desactivado, motivo: "sin depósito en mainnet; testnet sin UBTC (POBTC solo plomería)"}

senal:
  fuente: hyperliquid_spot              # decisión 7.4 (docs/hl_facts_verified.md)
  historia: "Bitstamp hasta 2026-10-22; HL spot desde 2026-10-23"
  respaldo_rv: "Binance BTCUSDC 5m solo si faltan barras HL"

criterios_implementacion:               # sección 15.2; todos deben pasar
  dias_a_tiempo_min: 0.99
  operaciones_duplicadas_max: 0
  paridad_senal: 1.0                    # vivo vs recálculo offline, tolerancia 1e-9
  discrepancias_ledger_sin_explicar: 0
  costo_por_orden_mediana_max: 0.0013   # shortfall vs cierre 00:00 + comisión
  costo_por_orden_p90_max: 0.0030
  dif_anual_equity_vs_replica_puntos_max: 1.5
  datos_cierre_hl_vs_ref_mediana_max: 0.0010
  datos_rv_hl_sobre_ref_rango: [0.85, 1.15]

rendimiento:                            # solo informativo
  referencia: results/atlas_v3/robustness.json
  regla: "debajo del percentil 5 de 12 meses -> revisión escrita; nunca ajuste automático"

sombras:
  stablecoins: {regla: engine/shadow.py, evaluacion: "2027-10-25"}

despues_de_12_meses: "documento aparte (Términos HL para México, región VPS, custodia UBTC/puente USDC, capital escalonado)"
