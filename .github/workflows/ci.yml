name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - name: gitleaks (binario fijado; usa .gitleaks.toml)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git . --redact -c .gitleaks.toml
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: pip install -r requirements-live.txt ruff
      - run: ruff check atlas tests --select E,F,W --ignore E501
      - run: python -m pytest tests/ -q -m "not testnet"
